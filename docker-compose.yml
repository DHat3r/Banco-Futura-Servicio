# Configuración: copia .env.example a .env y ajusta sus valores; compose lo lee solo.
#   INSTALL_SENTIMENT=true   instala y activa el modelo de sentimiento (imagen pesada)
#   API_PORT=18000           puerto de la API en tu máquina, si el 8000 está ocupado
# Las expresiones ${VAR:-valor} toman la variable del .env; "valor" solo se usa si no está definida.
#
# Uso (desde esta carpeta):
#   docker compose up -d --build     construye con la configuración del .env y levanta
#   docker compose config            muestra el archivo con las variables ya resueltas
#   docker compose logs -f api       sigue el arranque de la API
#   docker compose down              detiene todo
#
# Servicios: web (frontend en :5173, reenvía /api a la API) y api (FastAPI, Swagger en :API_PORT/docs).

services:
  api:
    build:
      context: ./backend
      args:
        INSTALL_SENTIMENT: ${INSTALL_SENTIMENT:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      ENABLE_SENTIMENT: ${INSTALL_SENTIMENT:-false}
      CORS_ORIGINS: http://localhost:5173
    volumes:
      # CSV completo de clientes (solo lectura); si no existe, la API usa la muestra.
      - ./backend/data:/app/data:ro
      # Caché de modelos de Hugging Face para no volver a descargarlos en cada arranque.
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      # La imagen slim no trae curl, así que el chequeo usa Python.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Margen amplio: con sentimiento, el primer arranque descarga BETO (~440 MB) antes de responder.
      # Durante este periodo los fallos no cuentan, y el servicio queda "healthy" en el primer chequeo que pasa.
      start_period: 10m

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  hf-cache:
