# Sirve la SPA de React. Cualquier ruta que no sea un archivo se resuelve en index.html
# para que el enrutado del lado del cliente funcione al recargar la página.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy inverso: /api/health -> http://api:8000/health dentro de la red de Docker.
    # El navegador habla solo con este origen, así que no depende del puerto de la API ni de CORS.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
